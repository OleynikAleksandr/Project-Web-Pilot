<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Цвета чата</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#25384b;background:#f4f6f8;--surface:#fff;--line:#dce4ea;--muted:#718294;--accent:#087e80;--soft:#e6f2ee}
*{box-sizing:border-box}body{margin:0}.page{padding:24px;max-width:580px;margin:auto}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px}h1{font-size:22px;line-height:1.2;margin:0 0 8px;font-weight:650}.hint{font-size:12px;line-height:1.5;color:var(--muted);margin:0}.close{border:0;background:transparent;font-size:20px;color:var(--muted);cursor:pointer;padding:0 2px}
.colors{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}.row{display:grid;grid-template-columns:48px 1fr 98px 28px;align-items:center;gap:10px;min-height:86px;padding:14px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.label{font-size:13px;font-weight:600;line-height:1.35}.mode{display:block;font-size:10px;color:var(--muted);margin-top:5px;font-weight:400}.picker{width:46px;height:42px;padding:2px;border:1px solid var(--line);border-radius:9px;background:var(--surface);cursor:pointer}.picker::-webkit-color-swatch-wrapper{padding:2px}.picker::-webkit-color-swatch{border:0;border-radius:5px}.hex{width:98px;min-width:0;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:inherit;padding:9px 7px;font:12px ui-monospace,monospace;text-transform:uppercase}.hex[aria-invalid=true]{border-color:#b34d40}.reset-one{border:0;color:var(--muted);background:transparent;font-size:21px;cursor:pointer;padding:3px}.reset-one:disabled{opacity:.3;cursor:default}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.foot{margin-top:18px;display:flex;flex-direction:column;gap:14px}.status{font-size:12px;line-height:1.45;min-height:34px;margin:0;color:var(--accent)}.status.error{color:#b34d40}.reset-all{align-self:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px 13px;background:var(--surface);color:inherit;font-size:12px;cursor:pointer}.reset-all:hover{border-color:var(--accent)}.reset-all:disabled{opacity:.5;cursor:default}
:root[data-theme=dark]{color-scheme:dark;color:#e4ebf2;background:#1b1d22;--surface:#23282f;--line:#39424c;--muted:#9caab8;--accent:#82cec8;--soft:#20312e}
</style></head><body><main class="page">
<div class="head"><div><h1>Цвета чата</h1><p class="hint">Выбирайте цвет и сразу смотрите результат в чате.<br>Окно можно перемещать за заголовок.</p></div><button id="close" class="close" aria-label="Закрыть редактор">✕</button></div>
<div id="colors" class="colors" aria-label="Цвета сообщений и фона"></div>
<div class="foot"><p id="status" class="status" role="status" aria-live="polite">Настройки сохраняются автоматически.</p><button id="reset-all" class="reset-all">Вернуть оформление ChatGPT</button></div>
</main><script type="module" src="./chat-colors.mjs"></script></body></html>
