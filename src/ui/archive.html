<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Архив проектов</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#25384b;background:#f4f6f8;--line:#dce4ea;--muted:#718294;--accent:#087e80}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:inherit;color:inherit}.page{padding:24px;display:flex;flex-direction:column;gap:16px;min-height:100vh}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}h1{font-size:22px;margin:0 0 5px}.hint{color:var(--muted);font-size:12px;line-height:1.5;margin:0}.close{border:0;background:transparent;font-size:20px;color:var(--muted);cursor:pointer}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar button{border:1px solid var(--line);background:white;border-radius:8px;padding:9px 12px;cursor:pointer}.toolbar .primary{background:var(--accent);color:white;border-color:var(--accent)}.toolbar .danger{color:#a33f32;border-color:#d7a49c}.toolbar button:disabled{opacity:.45;cursor:default}.notice{font-size:12px;padding:10px 12px;background:#e6f2ee;border-radius:8px;color:#32665c}.list{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:10px;background:white;overflow:auto;min-height:220px;flex:1}.item{padding:12px 14px;border-bottom:1px solid var(--line);cursor:default;user-select:none}.item:last-child{border-bottom:0}.item.selected{background:#dff0ef}.item strong{display:block;font-size:13px}.item small{display:block;color:var(--muted);margin-top:5px;font-size:11px;overflow-wrap:anywhere}.empty{padding:28px;text-align:center;color:var(--muted)}.delete{border-top:1px solid var(--line);padding-top:14px}.delete input{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:white;color:inherit}.delete p{font-size:12px;line-height:1.55}.delete-actions{display:flex;gap:8px;margin-top:10px}.delete-actions button{padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:white}.delete-actions .danger{background:#a54539;color:white;border-color:#a54539}:root[data-theme=dark]{color-scheme:dark;color:#e4ebf2;background:#1b1d22;--line:#39424c;--muted:#9caab8;--accent:#53bbb7}:root[data-theme=dark] .toolbar button,:root[data-theme=dark] .list,:root[data-theme=dark] .delete input,:root[data-theme=dark] .delete-actions button{background:#23282f;color:#dce5ed}:root[data-theme=dark] .item.selected{background:#203536}:root[data-theme=dark] .notice{background:#20312e;color:#91cfc1}
</style>
</head><body><main class="page">
<div class="head"><div><h1>Архив проектов</h1><p class="hint">Shift — диапазон · ⌘/Ctrl — отдельные проекты</p></div><button id="close" class="close" aria-label="Закрыть">✕</button></div>
<div id="notice" class="notice" hidden></div>
<div class="toolbar"><button id="restore" class="primary" disabled>Вернуть в активные</button><button id="forget" disabled>Убрать из списка</button><button id="delete" class="danger" disabled>Удалить с диска…</button><button id="recover" class="danger" hidden>Повторить очистку</button></div>
<ul id="archive-list" class="list" role="listbox" aria-multiselectable="true"><li class="empty">Архив пуст.</li></ul>
<section id="delete-panel" class="delete" hidden><strong id="delete-name"></strong><p id="delete-path" class="hint"></p><p id="delete-meta"></p><p>Для подтверждения введите точное имя проекта. Чаты ChatGPT останутся.</p><input id="delete-confirmation" autocomplete="off"><div class="delete-actions"><button id="confirm-delete" class="danger" disabled>Удалить безвозвратно</button><button id="cancel-delete">Отмена</button></div></section>
</main><script type="module" src="./archive.mjs"></script></body></html>
